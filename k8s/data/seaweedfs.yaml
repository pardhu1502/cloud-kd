# SeaweedFS (master + volume + filer + S3 gateway in one process) in namespace "data".
# The S3 identities file comes from the Secret seaweedfs-s3-config, created by
# scripts/secrets.sh from the git-ignored .env file. No keys are stored here.
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
  labels:
    app: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          command: ["weed"]
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -volume.max=20
            - -master.volumeSizeLimitMB=512
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: s3-config
          secret:
            secretName: seaweedfs-s3-config
---
# NodePort so the laptop can reach S3 on localhost:8333 (k3d maps 8333 -> 30333).
# Inside the cluster: http://seaweedfs.data.svc.cluster.local:8333
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
spec:
  type: NodePort
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
      nodePort: 30333
