# Traefik (bundled with k3s) routes /parse to the parser Service.
# k3d maps localhost:8080 to the Traefik load balancer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: parser
                port:
                  name: http
